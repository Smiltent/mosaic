
<canvas id="game" width="800" height="800" style="border: 1px solid #555;"></canvas>

<script>
    const SIZE = 8
    const canvas = document.getElementById("game")
    const ctx = canvas.getContext("2d")

    let width
    let height
    let tiles

    const ws = new WebSocket(`ws://${location.host}/ws`)
    ws.onmessage = (e) => {
        const msg = JSON.parse(e.data)

        if (msg.type === "world") {
            ({ width, height, tiles } = msg)
            draw()
        } else if (msg.type === "place") {
            tiles[msg.y * width + msg.x] = msg.tile
            drawCell(msg.x, msg.y)
        }
    }

    function drawCell(x, y) {
        ctx.fillStyle = tiles[y * width + x] ? "#333" : "#eee"
        ctx.fillRect(x * SIZE, y * SIZE, SIZE, SIZE)
    }

    function draw() {
        for (let y = 0; y < height; y++) {
            for (let x = 0; x < width; x++) {
                drawCell(x, y)
            }
        }
    }

    let painting = false
    canvas.onmousedown = (e) => {
        painting = true
        place(e)
    }

    onmousemove = (e) => painting && place(e)
    onmouseup = () => (painting = false)

    function place(e) {
        const x = Math.floor(e.offsetX / SIZE)
        const y = Math.floor(e.offsetY / SIZE)

        ws.send(JSON.stringify({
            type: "place",
            x, 
            y, 
            tile: e.button === 2 ? 0 : 1
        }))
    }

    oncontextmenu = (e) => e.preventDefault()
</script>
